<style>
  :root {
    --bg-top: #fdf4e6;
    --bg-bottom: #f6e8d3;
    --surface: #fffaf1;
    --tag-fill: rgba(232, 121, 42, 0.09);
    --ink: #2c2013;
    --muted: #6f6148;
    --line: rgba(44, 32, 19, 0.13);
    --accent: #e8792a;
    --accent-bright: #ff9a44;
    --accent-ink: #241300;
    --badge: #171310;
    --badge-line: rgba(255, 255, 255, 0.09);
    --ic-whatsapp: #1f9e5c;
    --ic-web: #2f6fad;
    --ic-mail: #c85a41;
  }
  /* min-width:0 on every element (not just border-box) is the standard fix for the flexbox
     "items refuse to shrink below their content's min-content width" trap - without it, a
     nowrap chip/label deep inside a nested flex chain (card > actions > quick-row > chip) can
     force every ancestor flex item to stay at that intrinsic width, overflowing narrow phones
     even though nothing has a literal fixed px width wider than the viewport. */
  * { box-sizing: border-box; min-width: 0; }
  html, body { margin: 0; padding: 0; overflow-x: hidden; width: 100%; }
  body {
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--ink);
    font-family: -apple-system, "Segoe UI Rounded", "Segoe UI", Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 22px 16px 28px;
    -webkit-font-smoothing: antialiased;
    line-height: 1.3;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  .card {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- header row: name+title on the right, logo on the left (Barak's ask,
     2026-08-15) - identity comes first in the DOM so it lands on the "start" (right) side
     under RTL, badge second so it lands on the "end" (left) side. ---------- */
  .header-row {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .identity { flex: 1; text-align: right; }
  .badge {
    flex: none;
    background: var(--badge);
    border: 1px solid var(--badge-line);
    border-radius: 14px;
    padding: 9px 16px;
    box-shadow: 0 8px 18px rgba(23, 19, 16, 0.18);
  }
  .badge img {
    display: block;
    width: 128px;
    max-width: 100%;
  }
  .name {
    margin: 0;
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: 0.005em;
    text-wrap: balance;
  }
  .title {
    margin: 2px 0 0;
    font-size: 0.86rem;
    font-weight: 700;
    color: var(--accent);
  }

  /* מקום שמור לתמונה קטנה של העובד (Barak's ask, 2026-08-15) - placeholder גנרי כרגע.
     להחלפה בתמונה אמיתית: למחוק את כל ה-<div class="avatar-slot">...</div> ולשים במקומו
     <img class="avatar-photo" src="שם-הקובץ.jpg" alt="..."> - הסגנון (עיגול, גודל, צל)
     כבר מוכן ומחכה ב-.avatar-photo למטה, אין צורך לגעת ב-CSS. */
  .avatar-slot {
    flex: none;
    width: 84px;
    height: 84px;
    margin-top: 14px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px dashed var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar-slot svg { width: 36px; height: 36px; color: var(--muted); opacity: 0.55; }
  .avatar-photo {
    flex: none;
    width: 84px;
    height: 84px;
    margin-top: 14px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--surface);
    box-shadow: 0 8px 16px rgba(23, 19, 16, 0.18);
  }

  .mark {
    width: 34px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-bright));
    margin: 14px 0 16px;
  }

  /* ---------- legal footer (Barak's ask, 2026-08-15) ---------- */
  .legal {
    width: 100%;
    text-align: center;
    margin: 14px 0 0;
    font-size: 0.66rem;
    color: var(--muted);
    opacity: 0.85;
  }

  /* ---------- actions ---------- */
  .actions {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid transparent;
    font-size: 0.98rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn svg { width: 22px; height: 22px; flex: none; }
  .icon-whatsapp { color: var(--ic-whatsapp); }
  .icon-web { color: var(--ic-web); }
  .btn-primary {
    background: linear-gradient(180deg, var(--accent-bright), var(--accent));
    color: var(--accent-ink);
    box-shadow: 0 8px 18px rgba(232, 121, 42, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.4);
  }
  .btn-primary:hover { filter: brightness(1.04); }
  .btn-secondary {
    background: var(--surface);
    color: var(--ink);
    border-color: var(--line);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  .quick-row {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .chip {
    flex: 1 1 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 8px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip svg { width: 18px; height: 18px; flex: none; color: var(--accent); }
  /* combined selector (2 classes) needed to out-specificity ".chip svg" above, which already
     declares color - a plain ".icon-phone{color:...}" alone loses that fight silently. */
  .chip svg.icon-phone { color: var(--ic-whatsapp); }
  .chip svg.icon-mail { color: var(--ic-mail); }
  .chip:hover { color: var(--ink); border-color: var(--accent); }

  /* ---------- reasons list ---------- */
  .reasons {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-top: 18px;
  }
  .reason {
    display: flex;
    align-items: flex-start;
    gap: 9px;
  }
  .reason-icon {
    flex: none;
    width: 18px;
    height: 18px;
    margin-top: 1px;
  }
  .reason-icon circle { fill: var(--accent); }
  .reason-icon path { stroke: #fff9f1; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .reason span {
    flex: 1;
    font-size: 0.86rem;
    font-weight: 600;
    line-height: 1.35;
    color: var(--ink);
  }

  /* ---------- contact strip ---------- */
  .contact-strip {
    width: 100%;
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .contact-strip a {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--ink);
  }
  .contact-strip a svg { width: 18px; height: 18px; flex: none; color: var(--accent); }
  .contact-strip a svg.icon-phone { color: var(--ic-whatsapp); }
  .contact-strip a:hover { color: var(--accent); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
